[project]
name = "curing_chamber"
version = "0.3.1"
description = "Home Assistant custom integration to drive a charcuterie curing chamber."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = [
    "custom_components/curing_chamber/regulation",
    "custom_components/curing_chamber/program",
    "custom_components/curing_chamber/batch",
]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PL", "RUF"]
ignore = [
    "PLR0913",  # many arguments: control logic legitimately takes several tuning knobs
    "PLR0917",  # many positional arguments: same reasoning (newer ruff rule)
    "PLR0912",  # many branches: the engine is inherently branchy
    "PLR0911",  # many returns
    "PLR2004",  # magic values in tests/formulas
    "PLR0915",  # many statements
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]
# Translated notification sentences are data; keep them on one readable line.
"custom_components/curing_chamber/messages.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
# Only the pure engines are strictly typed; the HA glue (parent package __init__,
# coordinator, platforms) is pulled in as a followed import and silenced.
follow_imports = "silent"
files = [
    "custom_components/curing_chamber/regulation",
    "custom_components/curing_chamber/program",
    "custom_components/curing_chamber/batch",
]

[[tool.mypy.overrides]]
module = "homeassistant.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
