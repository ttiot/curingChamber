start_program:
  name: Start program
  description: Start a drying program (preset or user-defined) on a chamber.
  fields:
    device_id:
      name: Chamber
      description: Target chamber device (optional if only one is configured).
      selector:
        device:
          integration: curing_chamber
    program_id:
      name: Program id
      description: Identifier of the program to start (e.g. saucisson_sec).
      required: true
      example: saucisson_sec
      selector:
        text:

stop_program:
  name: Stop program
  description: Stop the running program on a chamber.
  fields:
    device_id:
      name: Chamber
      selector:
        device:
          integration: curing_chamber

pause_program:
  name: Pause program
  description: Pause the running program (freezes the phase clock).
  fields:
    device_id:
      name: Chamber
      selector:
        device:
          integration: curing_chamber

resume_program:
  name: Resume program
  description: Resume a paused program.
  fields:
    device_id:
      name: Chamber
      selector:
        device:
          integration: curing_chamber

next_phase:
  name: Next phase
  description: Advance the program to its next phase immediately.
  fields:
    device_id:
      name: Chamber
      selector:
        device:
          integration: curing_chamber

set_targets:
  name: Set manual targets
  description: Set manual temperature/humidity targets (no program running).
  fields:
    device_id:
      name: Chamber
      selector:
        device:
          integration: curing_chamber
    temperature:
      name: Temperature
      description: Target temperature in °C (omit to leave unregulated).
      selector:
        number:
          min: -10
          max: 40
          step: 0.5
          unit_of_measurement: "°C"
    humidity:
      name: Humidity
      description: Target relative humidity in % (omit to leave unregulated).
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"

set_reference_weight:
  name: Set reference weight
  description: Tare/record the reference weight for weight-loss tracking.
  fields:
    device_id:
      name: Chamber
      selector:
        device:
          integration: curing_chamber
    weight:
      name: Weight
      description: Reference weight (omit to read the current scale value).
      selector:
        number:
          min: 0
          max: 100000
          step: 1

acknowledge_alert:
  name: Acknowledge alerts
  description: Acknowledge active alerts to silence reminders until they clear.
  fields:
    device_id:
      name: Chamber
      selector:
        device:
          integration: curing_chamber

create_program:
  name: Create/update program
  description: Create or update a user-defined program from a JSON object.
  fields:
    device_id:
      name: Chamber
      selector:
        device:
          integration: curing_chamber
    program:
      name: Program
      description: Program definition (id, name, phases[...]).
      required: true
      example: >-
        {"id": "my_coppa", "name": "My Coppa", "phases": [
          {"name": "rest", "target_temp": 22, "target_humidity": 80,
           "end_kind": "duration", "duration_hours": 24},
          {"name": "drying", "target_temp": 13, "target_humidity": 75,
           "end_kind": "weight_loss", "weight_loss_pct": 35, "duration_hours": 1344}]}
      selector:
        object:

delete_program:
  name: Delete program
  description: Delete a user-defined program.
  fields:
    device_id:
      name: Chamber
      selector:
        device:
          integration: curing_chamber
    program_id:
      name: Program id
      required: true
      selector:
        text:

create_batch:
  name: Create batch
  description: >-
    Register a product being cured. It tracks weight loss from its weigh-ins;
    the reference batch drives the running program's weight-loss phase.
  fields:
    device_id:
      name: Chamber
      selector:
        device:
          integration: curing_chamber
    name:
      name: Name
      description: Display name of the batch (e.g. "Coppa #1").
      required: true
      example: Coppa #1
      selector:
        text:
    product:
      name: Product
      description: Free-text product/recipe (e.g. coppa, saucisson).
      selector:
        text:
    program_id:
      name: Program id
      description: Optional program associated with this batch.
      selector:
        text:
    reference_weight:
      name: Reference weight
      description: Starting weight (omit to use the first weigh-in as reference).
      selector:
        number:
          min: 0
          max: 100000
          step: 1
    target_loss_pct:
      name: Target weight loss
      description: Target weight loss in % of the reference weight.
      selector:
        number:
          min: 0
          max: 90
          step: 1
          unit_of_measurement: "%"
    set_as_reference:
      name: Set as reference
      description: Make this the reference batch driving the program.
      selector:
        boolean:

record_weight:
  name: Record weigh-in
  description: >-
    Add a weigh-in to a batch (works without a scale). Optionally attach a
    timestamp, a note and a photo.
  fields:
    device_id:
      name: Chamber
      selector:
        device:
          integration: curing_chamber
    batch_id:
      name: Batch id
      description: Identifier of the batch (from create_batch).
      required: true
      selector:
        text:
    weight:
      name: Weight
      description: Measured weight, in the same unit as the reference weight.
      required: true
      selector:
        number:
          min: 0
          max: 100000
          step: 1
    timestamp:
      name: Timestamp
      description: When the weigh-in was taken (defaults to now).
      selector:
        datetime:
    note:
      name: Note
      description: Optional free-text note for this weigh-in.
      selector:
        text:
    photo:
      name: Photo
      description: >-
        Optional photo as a data URL, base64 string, or a local file path;
        stored under /config/www and served at /local/curing_chamber/...
      selector:
        text:

set_reference_batch:
  name: Set reference batch
  description: Choose which batch drives the program's weight-loss phase.
  fields:
    device_id:
      name: Chamber
      selector:
        device:
          integration: curing_chamber
    batch_id:
      name: Batch id
      required: true
      selector:
        text:

complete_batch:
  name: Complete batch
  description: Mark a batch as completed (finished curing).
  fields:
    device_id:
      name: Chamber
      selector:
        device:
          integration: curing_chamber
    batch_id:
      name: Batch id
      required: true
      selector:
        text:

archive_batch:
  name: Archive batch
  description: Archive a batch (kept for history, hidden from active tracking).
  fields:
    device_id:
      name: Chamber
      selector:
        device:
          integration: curing_chamber
    batch_id:
      name: Batch id
      required: true
      selector:
        text:

delete_batch:
  name: Delete batch
  description: Permanently delete a batch and its weigh-in history.
  fields:
    device_id:
      name: Chamber
      selector:
        device:
          integration: curing_chamber
    batch_id:
      name: Batch id
      required: true
      selector:
        text:
