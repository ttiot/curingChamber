name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest-homeassistant-custom-component pytest-cov

      - name: Ruff (lint)
        run: ruff check custom_components tests

      - name: Ruff (format)
        run: ruff format --check custom_components tests

      - name: Mypy (pure engines, strict)
        run: mypy

      - name: Pytest with coverage
        run: |
          pytest \
            --cov=custom_components/curing_chamber/regulation \
            --cov=custom_components/curing_chamber/program \
            --cov-report=term-missing \
            --cov-fail-under=85
