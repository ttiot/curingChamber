name: HACS

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # These checks only gate inclusion in the HACS *default* store, not
          # installation via a custom repository:
          #   - brands: requires assets submitted to home-assistant/brands
          #   - topics/description: repository "About" metadata (owner setting)
          # Set the repo description + topics and submit to brands, then drop
          # these ignores, to make the integration default-store ready.
          ignore: brands topics description
